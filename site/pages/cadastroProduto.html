<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cadastro de produto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/cadastroProduto.css">
</head>
<body>
  <header>
    <h1>Novo produto</h1>
    <p>Preencha à direita e veja à esquerda como o cliente vai enxergar.</p>
  </header>

  <main>
    <section class="painel">
      <h2>Visão do cliente <span class="ao-vivo">AO VIVO</span></h2>
      <iframe id="preview" src="preview.html" title="Pré-visualização"></iframe>
    </section>

    <section class="painel">
      <h2>Cadastro do vendedor</h2>
      <iframe id="form" src="form.html" title="Cadastro"></iframe>
    </section>
  </main>

  <script src="/site/js/cadastroProduto.js"></script>
</body>
</html>
