<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/produtoBase.css">
  <link rel="stylesheet" href="../css/preview.css">
</head>
<body>
  <div class="bloco">
    <div class="rotulo">Na vitrine</div>
    <div class="lista-produtos">
      <div class="produto" id="card">
        <span class="selo" id="selo" hidden></span>
        <img id="img" alt="">
        <h3 id="nome"></h3>
        <p id="preco"></p>
        <button type="button" id="btn">ADICIONAR AO CARRINHO</button>
      </div>
    </div>
  </div>

  <div class="bloco">
    <div class="rotulo">Ao abrir o produto</div>
    <div class="detalhe">
      <img id="img2" alt="">
      <div>
        <div class="cat" id="cat"></div>
        <h3 id="nome2"></h3>
        <div class="desc" id="desc"></div>
        <div class="parc" id="parc"></div>
        <div class="estq" id="estq"></div>
      </div>
    </div>
  </div>

  <script src="/site/js/preview.js"></script>
</body>
</html>
