<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<title>Cadastro</title>
</head>
<body>
<img class="logo" src="../img/logo.png" alt="Logo" onerror="this.remove()">
<h1>Criar conta</h1>
<p class="sub">Preencha os dados para se cadastrar.</p>
<form class="login-form" id="formCadastro" novalidate>
  <div><label for="nome">Nome</label><input id="nome" type="text" autocomplete="name"></div>
  <div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email"></div>
  <div><label for="cpf">CPF</label><input id="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div>
  <div><label for="telefone">Telefone</label><input id="telefone" type="tel" maxlength="15" placeholder="(00) 00000-0000"></div>
  <div><label for="senha">Senha</label><input id="senha" type="password" autocomplete="new-password"></div>
  <div><label for="confirmarSenha">Confirmar senha</label><input id="confirmarSenha" type="password" autocomplete="new-password"></div>
  <span id="mensagem" class="msg" role="alert"></span>
  <button type="submit">Cadastrar</button>
  <div class="rodape">Já tem conta? <a href="../index.html">Entrar</a></div>
</form>
<script src="../js/seguranca.js"></script>
<script src="../js/cadastro.js"></script>
</body>
</html>
